<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2600" viewBox="0 0 1600 2600">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3f6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="studs" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="5" fill="#0b1726" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="2600" fill="url(#base)"/>
  <rect width="1600" height="2600" fill="url(#studs)"/>

  <circle cx="220" cy="260" r="260" fill="#37c6dc" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1420" cy="520" r="320" fill="#087ea4" opacity="0.08" filter="url(#soft)"/>
  <circle cx="300" cy="980" r="300" fill="#075a76" opacity="0.06" filter="url(#soft)"/>
  <circle cx="1300" cy="1300" r="280" fill="#37c6dc" opacity="0.09" filter="url(#soft)"/>
  <circle cx="150" cy="1700" r="260" fill="#087ea4" opacity="0.07" filter="url(#soft)"/>
  <circle cx="1450" cy="1950" r="340" fill="#0b1726" opacity="0.05" filter="url(#soft)"/>
  <circle cx="500" cy="2250" r="300" fill="#37c6dc" opacity="0.08" filter="url(#soft)"/>
  <circle cx="1250" cy="2450" r="260" fill="#075a76" opacity="0.06" filter="url(#soft)"/>
</svg>
